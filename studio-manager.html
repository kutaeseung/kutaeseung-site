<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ku Taeseung - Studio Manager</title>
  <style>
    @charset "UTF-8";
    :root {
      --bg-panel: #fcfcfc;
      --border-color: #e0e0e0;
      --primary-blue: #0066cc;
      --edit-orange: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      font-size: 13px;
      background-color: #f0f0f2;
      color: #111111;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
    }
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
    }
    .edit-panel {
      width: 500px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab-btn.active {
      background-color: #000000;
      color: #ffffff;
    }
    .section-box {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 12px;
      color: #666666;
    }
    input, textarea {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #000000;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-action {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-action:hover {
      background: #333333;
    }
    .btn-cancel {
      background: #888888;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-cancel:hover {
      background: #666666;
    }
    .btn-download {
      background: var(--primary-blue);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-download:hover {
      background: #0052a3;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .item-card {
      background: #fafafa;
      border: 1px solid #e5e5e5;
      padding: 10px 12px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 10px;
    }
    .item-card.editing {
      border-color: var(--edit-orange);
      background: #fffbeb;
    }
    .item-info {
      flex: 1;
      word-break: break-all;
    }
    .item-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-reorder {
      background: #eeeeee;
      border: 1px solid #cccccc;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-reorder:hover {
      background: #dddddd;
    }
    .btn-edit {
      background: #ffffff;
      border: 1px solid #cccccc;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      color: #0066cc;
      font-weight: 500;
    }
    .btn-edit:hover {
      background: #f0f7ff;
    }
    .btn-delete {
      color: #cc0000;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      margin-left: 4px;
    }
    .preview-panel {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .preview-bar {
      background: #f8f8fa;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 12px;
      color: #777777;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Ku Taeseung - Studio Manager</div>
    <button class="btn-download" onclick="downloadCurrentFile()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="btn-download-text">works.html 다운로드</span>
    </button>
  </header>

  <div class="main-layout">
    <!-- 좌측 편집 패널 -->
    <div class="edit-panel">
      
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="setMode('works')">Selected Works</button>
        <button class="tab-btn" onclick="setMode('texts')">Texts (JSON 관리)</button>
        <button class="tab-btn" onclick="setMode('exhibitions')">Exhibitions</button>
      </div>

      <!-- 1. Selected Works 패널 (추가 & 수정 공용 폼) -->
      <div id="panel-works" class="section-box">
        <div class="section-title">
          <span id="works-form-title">새 작품 추가하기</span>
          <span id="works-edit-badge" style="display:none; font-size:11px; color:#d97706; font-weight:normal;">(수정 모드)</span>
        </div>
        <div class="row">
          <div class="form-group">
            <label>파일명 (images/selected-works/ 안)</label>
            <input type="text" id="w-file" placeholder="예: frank.jpg">
          </div>
          <div class="form-group">
            <label>세로 높이 (cm - 벽면 비율용)</label>
            <input type="number" id="w-h" placeholder="예: 65">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>작품 제목</label>
            <input type="text" id="w-title" placeholder="예: Frank">
          </div>
          <div class="form-group">
            <label>제작 연도</label>
            <input type="text" id="w-year" placeholder="예: 2024">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>재료 (선택)</label>
            <input type="text" id="w-material" placeholder="예: 나무 위에 비단에 아크릴">
          </div>
          <div class="form-group">
            <label>크기 (세로×가로cm)</label>
            <input type="text" id="w-size" placeholder="예: 65×52cm">
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-save-work" class="btn-action" style="flex:1;" onclick="saveWork()">+ 목록에 작품 추가</button>
          <button id="btn-cancel-work" class="btn-cancel" style="display:none;" onclick="cancelEditWork()">취소</button>
        </div>

        <div style="margin-top: 16px;">
          <label>등록된 작품 목록 (<strong>수정</strong> 버튼으로 제목/캡션 즉시 변경, ▲/▼로 순서 이동)</label>
          <div class="item-list" id="works-list"></div>
        </div>
      </div>

      <!-- 2. Texts 패널 (추가 & 수정 공용 폼) -->
      <div id="panel-texts" class="section-box" style="display: none;">
        <div class="section-title">
          <span id="texts-form-title">새 글 / 평론 추가하기</span>
          <span id="texts-edit-badge" style="display:none; font-size:11px; color:#d97706; font-weight:normal;">(수정 모드)</span>
        </div>
        <div class="row">
          <div class="form-group">
            <label>저자 / 필자</label>
            <input type="text" id="t-author" placeholder="예: 강동호">
          </div>
          <div class="form-group">
            <label>작성 연도</label>
            <input type="text" id="t-year" placeholder="예: 2025">
          </div>
        </div>
        <div class="form-group">
          <label>글 제목</label>
          <input type="text" id="t-title" placeholder="예: Before This River Becomes an Ocean">
        </div>
        <div class="form-group">
          <label>본문 내용 (엔터 2번으로 문단 구분)</label>
          <textarea id="t-content" placeholder="본문 내용을 그대로 붙여넣으세요."></textarea>
        </div>
        <div class="form-group">
          <label>각주 / 캡션 (선택, 엔터 1번으로 구분)</label>
          <textarea id="t-footnotes" placeholder="[1] 출처..." style="min-height: 50px;"></textarea>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-save-text" class="btn-action" style="flex:1;" onclick="saveText()">+ 목록에 글 추가</button>
          <button id="btn-cancel-text" class="btn-cancel" style="display:none;" onclick="cancelEditText()">취소</button>
        </div>

        <div style="margin-top: 16px;">
          <label>등록된 글 목록 (<strong>수정</strong> 버튼으로 본문/제목 변경, ▲/▼로 순서 이동)</label>
          <div class="item-list" id="texts-list"></div>
        </div>
      </div>

      <!-- 3. Exhibitions 패널 (추가 & 수정 공용 폼) -->
      <div id="panel-exhibitions" class="section-box" style="display: none;">
        <div class="section-title">
          <span id="exhibitions-form-title">새 전시 추가하기</span>
          <span id="exhibitions-edit-badge" style="display:none; font-size:11px; color:#d97706; font-weight:normal;">(수정 모드)</span>
        </div>
        <div class="form-group">
          <label>전시 상세 HTML 파일명</label>
          <input type="text" id="e-link" placeholder="예: Amator.html">
        </div>
        <div class="form-group">
          <label>대표 이미지 파일명 (images/exhibitions/ 안)</label>
          <input type="text" id="e-img" placeholder="예: Amator_0.jpg">
        </div>
        <div class="form-group">
          <label>전시 캡션</label>
          <input type="text" id="e-caption" placeholder="예: 아마토 Amator, Long Vacance, 2026">
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-save-exhibition" class="btn-action" style="flex:1;" onclick="saveExhibition()">+ 목록에 전시 추가</button>
          <button id="btn-cancel-exhibition" class="btn-cancel" style="display:none;" onclick="cancelEditExhibition()">취소</button>
        </div>

        <div style="margin-top: 16px;">
          <label>등록된 전시 목록 (<strong>수정</strong> 버튼으로 캡션 변경, ▲/▼로 순서 이동)</label>
          <div class="item-list" id="exhibitions-list"></div>
        </div>
      </div>

    </div>

    <!-- 우측 실시간 미리보기 패널 -->
    <div class="preview-panel">
      <div class="preview-bar" id="preview-bar-title">실시간 미리보기: works.html</div>
      <iframe id="preview-frame"></iframe>
    </div>
  </div>

  <script>
    let currentMode = 'works';
    let editingWorkIndex = -1;
    let editingTextIndex = -1;
    let editingExhibitionIndex = -1;

    // 1. Selected Works 12개 실제 작품 데이터
    let worksData = [
      { file: 'colorchecker.jpg', h: 60, title: 'Colorchecker', year: '2024', material: '', size: '' },
      { file: 'duet1.jpg', h: 55, title: 'Duet 1', year: '2024', material: '', size: '' },
      { file: 'duet2.jpg', h: 55, title: 'Duet 2', year: '2024', material: '', size: '' },
      { file: 'frank.jpg', h: 65, title: 'Frank', year: '2024', material: '', size: '' },
      { file: 'greenwood.jpg', h: 70, title: 'Greenwood', year: '2024', material: '', size: '' },
      { file: 'middle eye(I).png', h: 50, title: 'Middle Eye (I)', year: '2023', material: '', size: '' },
      { file: 'optogram.png', h: 45, title: 'Optogram', year: '2023', material: '', size: '' },
      { file: 'optography.jpg', h: 45, title: 'Optography', year: '2023', material: '', size: '' },
      { file: 'strokes.png', h: 60, title: 'Strokes', year: '2024', material: '', size: '' },
      { file: 'sunpainting.png', h: 65, title: 'Sun Painting', year: '2024', material: '', size: '' },
      { file: 'woodnew.png', h: 58, title: 'Wood New', year: '2024', material: '', size: '' },
      { file: 'woodnew2.png', h: 58, title: 'Wood New 2', year: '2024', material: '', size: '' }
    ];

    // 2. texts-data.json 데이터
    let textsData = [
      {
        id: 'text-1',
        author: '강동호',
        title: 'Before This River Becomes an Ocean',
        year: '2025',
        content: [
          "“사실, 표현은 인식 그 이상의 것이다; 글을 쓴다는 것은 인식한다는 것 그 이상이다; 적어도 분석적으로 인식하는 것 그 이상이다: 다시 만드는 거다. 이는, 사물을 재현하는 게 아니라면: 적어도 무엇인가를 생산하는 거다, 인간에게 즐거움을 주는 대상을.”[1]",
          "그림보다 먼저 이미지의 세계가 존재한다. 누군가는 빠르게 누군가는 느리게 이미지를 사유한다. 누군가는 이미지를 신뢰하고 누군가는 이미지를 의심한다. 누군가는 이미지로 인해 혼란에 빠지고 누군가는 이미지를 통해 이해에 가닿는다. 로버트 그레이브스의 시 「In Broken Images」는 창작에 두 가지 길이 있음을 이야기한다. 선명한 이미지로 향하는 길과 부서진 이미지로 향하는 길. 선명한 이미지를 가정하면 판단이 무뎌지고 부서진 이미지를 가정하면 감각이 날카로워진다. 이미지의 균열을 덮어 두려는 쪽과 파고들려는 쪽이 무한히 결집하는 곳에 그림은 나타난다. 화가는 다음과 같은 그림의 명령을 실천한다. 무엇에 대해서든 아직 말해지지 않은 것을 시작하라.",
          "최이안(b.2000)의 그림은 선명한 이미지 속에 있기에 언제라도 흐려질 수 있는 가능성을 내포한다. 작가의 그림이 동력을 얻는 과정은 주로 우리에게 친숙한 동식물이라는 소재에 달라붙어 있는 관념을 비틀어 모순을 발생시키면서 이루어진다. 연약함과 위협감이 뒤섞이고 무해함과 섬뜩함이 공존하는 이러한 형식은 의미상의 전진과 후퇴를 동시에 만들어 내는 것으로서 사물의 온전함에 대한 작가의 무의식적인 저항이 시각화된 결과다. 외투를 껴입은 기호들은 그 자체로 불가해한 불안을 가시화하며 재현의 원환적인 순환 구조를 벗어난다. 그림 안에서 형태들, 곧 단어들은 직관적으로 서로 어울리기보다는 예상하지 못한 순간에 접합하거나 분리되면서 시적인 긴장감을 형성한다. 저마다의 방식으로 침묵에 빠진 도상들은 미완의 형상이 되기를 자처하며 비언어적인 감정을 불수의적으로 환기한다. 작품마다 하나의 수사법이 필요하다는 듯이 최이안의 그림은 각각이 생경한 관점과 특성을 드러낸다. 마치 그렇게 하는 것이 정당하다고 주장하려는 것처럼 주어진 수단들을 낯설게 살펴보는 일을 두려워하지 않는 태도이다.",
          "구태승(b.1998)의 작업은 부서진 이미지를 수집하기에 우연함을 붙잡아 두기 위한 강도 높은 성실함과 정밀함을 요구한다. 얼룩에 대한 작가의 관심이 목재의 주름과 상처를 모방하는 일에서 출발하였다는 점에 주목하자. 그려진 것과 보이는 것이 포개어진 회화의 레이어는 아이러니의 어원인 에이로네이아(εἰρωνεία)가 변장이라는 뜻을 가지고 있음을 상기하게 한다. 작품에는 물감이 쌓이고 지워지는 자리마다 흔적이 아닌 무언가를 찾고자 했던 화가의 시선이 고스란히 투영되어 있다. 무의지적 기억이 견인하는 그림의 표면은 태양의 흑점이나 회전하는 목성의 무늬를 닮아 있기도 하고 풍경과 신체의 일부를 넌지시 암시하기도 한다. 합판이 제작되는 방식을 참조하는 근래의 연작에서는 물감층과 그림층의 경계를 재료로 삼아 실재하지 않는 원본에 먼지와 자국을 덧입힌다. 구태승의 그리기는 우리의 눈을 속이는 데 그치지 않고 현실보다 더 실제적인 허구를 제시하는 것을 목표로 한다. 비록 미적 행위의 무용함을 넘어서려고 하는 시도가 불가능성을 마주한다고 해도 관조를 허용하는 그림들의 양태를 깊이 들여다볼 때면 단순한 외연이 새로운 인상을 안겨 준다는 것을 이내 알아차리게 된다.",
          "괴물이 살고 있다고 전해지는 네스호에는 최근까지도 첨단 장비와 수백 명의 대원들이 투입되었다고 알려져 있다. 여전히 사람들은 개기일식이 연출하는 신비로운 현상들을 지켜보며 옛날 옛적 불길한 미신을 머릿속으로 떠올린다. 최이안과 구태승의 이인전 《Before This River Becomes an Ocean[2]》(2025)는 과학적 합리성으로 설명되지 않는 믿음의 체계를 조명하며 이미지에 대한 충실성이 전개되는 일련의 주체적인 입장들을 탐색한다. 조지 마이클의 노래 「Faith」의 화자는 연인을 향한 마음에 스스로를 내맡기려고 하지만 조금 더 분명한 확신에 이르기 위해 내면을 점검한다. 감당할 수 없는 것을 계속하겠다는 결심은 사랑이라는 변화가 삶을 전면적으로 재배치하기 전에, “강이 바다가 되기 전에” 공언되어야 할 것이다. 예술의 영역에서도 신념이 시험대에 오르는 일은 피할 수 없이 강제된다. 캔버스에 자신이 바라본 것을 결연히 옮겨 놓는 화가의 시점을 따라가다 보면 허상이라고 단언할 수 없는 견고한 환영을 경험하게 된다. 최이안이 시시각각으로 불협하는 이미지를 긍정하기로 결정한다면 구태승은 이미지를 명명할 수 없는 무력감을 능동적인 계기로 전환하는 데 성공한다. 작품을 창안하는 일은 미래의 질서를 선택하는 일이라고 퐁주는 말한 바 있다.[3] 두 사람이 각자의 미래를 그려 보이는 이번 전시가 일상과 약간은 다른 질서 속에 머무를 수 있기를 희망한다."
        ],

        content: [
          "새 몸을 가지기 위해 벌어지는 화면 위의 미시적인 투쟁은 그림을 그리는 사람에게는 거스를 수 없는 평등한 숙명과 같아서 나이와 경험의 많고 적음에 상관하지 않는다. 누구든 새 몸을 원한다면 스스로 거푸집을 지어 설계하고 그 속에 중첩된 시간과 붓질을 쌓아 올려야 한다. 반복적인 붓질은 파도처럼 현재의 시간을 계속 밀어내면서 수많은 과거를 만들어 내고, 미처 과거로 빠져나가지 못한 마르지 않은 안료와 현재를 뒤섞는다. 과거와 현재, 관념과 물질, 거리와 온도, 대상과 믿음이 섞이고, 마지막 가칠이 얹히면 투쟁의 시간은 멈추고 거푸집에서 새 몸이 분리된다. 화면 위의 시간과 붓질은 투명해서 밀어낸 과거의 색이 현재의 색과 겹쳐 희미하게 빛을 낸다. 획이 그어지고 색이 칠해진 그림의 표면은 껍데기이면서 피부이고 보이지 않는 수고로움 끝에 얻은 새 몸이다."

      {
        id: 'text-3',
        author: '임이랑',
        title: '보는 것, 맺히는 것, 남는 것',
        year: '2023',
        content: [
          "흑백으로 간결히 표현된 타오르는 초가 육면체의 얇고 불투명한 비단 큐브 위에 희미하게 떠오른다. 한 번의 입김이면 사라질 불꽃의 이미지이지만 연약한 비단이 흉내 내는 단단한 캔버스의 공간감과 마치 감광되어 화면 위에 영구히 박제된 듯한 사진적인 분위기가 불꽃의 존재감을 드러낸다. 한편에는 빠르게 휘몰아 지나가는 초록의 대기 너머로 초점을 잃지 않고 응시하는 푸른 눈동자가 있다. 붓질들 사이사이에 드러난 흰 바탕이 눈동자의 존재를 의심하게 만든다. 초록이 다 걷히고 나면 볼 수 있는 것은 선명한 눈동자일까, 아니면 아무것도 없는 빈 화면일까. 그 눈동자의 반대편에는 구형 아반떼의 크롭된 차량 전조등이 있다. 의인화된 눈처럼 서로를 마주 보고 있는 가운데, 번쩍하고 점등하는 순간의 전조등 이미지가 구형 아반떼 대각선 양옆으로 디스플레이되어 있다. 그리고 소등의 이미지가 등장한다. 꺼진 초라는 제목과 달리 어두운 바탕 위 선명히 하얀 실루엣에 불씨가 덜 꺼진 듯 심지가 부풀어 있다.",
          "아직까진 그의 작업이 표현의 측면에서는 하나로 온전히 묶이지 않고, 각 이미지 간의 거리감도 제각각이라 하나의 축을 만들어 읽으려는 시도가 비약일 수도 있겠다는 생각이 들지만, 그럼에도 그가 어떤 소재를 선택했고, 각각의 소재를 어떻게 표현하고자 했는지를 들여다보며, 일관된 정서를 느낄 수 있었다. ‘눈’과 ‘빛’이라는 소재는 ‘본다’는 행위를 연상케 한다. 그러나 그의 페인팅은 편안한 상태의 ‘보기’가 아닌, 흐리거나, 한 겹 막이 씌워져 있거나, 눈부심 (소위 말하는 눈뽕) 이거나, 불이 꺼져 잔상만 남아있는 순간, 그러니까 보기를 방해하는 상황에서 ‘보기’를 이야기하고 있는 듯하다. 그런데도 쳐다보기를 멈추지 않는 시선의 끝은 어디에 가닿고 있는 것일까? 그것은 오랜 과거의 기억일 수도 있고, 방문해 보지 못한 세계의 풍경일 수도 있고, 스펙타클한 뉴스로 가득한 세상에서 무게감을 느끼지 못하는 일상의 어느 순간일 수도 있을 것이다. 마치 사진으로도 남아있지 않은 어릴 적 부모님의 자동차나, 죽음을 상상케 했던 타국의 자연, 묻지마 살인사건으로 온 나라가 떠들썩했던 어느 날의 한가로운 창밖 풍경처럼 말이다.",
          "그러나 앞서 말했듯, 각각의 그림들이 표현된 방식은 굉장히 다르다. ‘촛불’과 ‘꺼진 초’의 경우 흑백의 톤으로 간결한 윤곽만이 강조되면서 감광되어 남은 이미지와 같은 인상, 사진의 성격이 강조된다. 리히터의 그림들이 연상되면서 그와 같은 미술사적인 맥락에서 읽어볼 수도 있겠다는 생각이 든다. 그런 점에서는 상징이나 기호로 읽히기도 한다. ‘촛불’과 ‘꺼진 초’가 같은 소재를 공유한다는 점에서는 묶일 수 있으나 사실 그 둘도 굉장히 다르다. 어찌 보면 캔버스는 분명 입체이지만 평면으로 인식하기로 합의된 지지체이다. 그 때문에 육면체의 비단은 상대적으로 연약한 물질임에도 불구하고 캔버스보다 더 확실한 부피감을 드러낸다. 또한 캔버스 위에 그려진 ‘꺼진 초’는 ‘그림이 벽에 걸려있다’는 인상을 준다면 ‘촛불’은 ‘이미지가 부유하고있다’는 인상을 주면서 역전된 힘의 방향을 느끼게 한다. ‘찍어낸’ 것 같은 모노톤과 여러 번의 붓질을 통해 ‘쌓아 올린’ 것 같은 톤도 방향의 차이를 느끼는 데에 한몫하고 있다.",
          "때문에 ‘꺼진 초’가 ‘촛불’보다는 ‘회화적’이라고 할 수 있겠으나 이 또한 어디까지나 상대적인 것으로 표현적인 부분은 ‘구형 아반떼’와 두 개의 ‘Twin Fantasy’에서 더 두드러지며, ‘가려진 눈’에서는 오직 표현이 강조된다. ‘구형 아반떼’는 재현적이지만 작은 붓 터치로 자국을 남기며 표현되었다는 점, 수평 수직을 딱 맞추는 일종의 ‘증명사진’ 같은 화면이거나, 45 도 각도의 ‘제품 사진’ 같은 화면이 아니라는 점에서도 모호한 성격을 갖는다. 사진보다는 일반적인 성인의 시야에서 바라본 차량 전조등 같아서 인간적인 시야를 연상시킨다. ‘Twin Fantasy’의 경우 인간의 눈으로는 제대로 관찰할 수 없는 점멸의 순간 빛 번짐이라는 소재를 재현하고 있어 조금 더 사진의 성격을 갖지만, 자국을 남기는 표현이 그 관계성을 약화한다. 더불어‘구형 아반떼’와 대각선으로 걸린 두 개의 ‘Twin Fantasy’의 디스플레이는 각각의 그림보다는 서로의 관계를 강화하면서 어떠한 서사를 상상하게 만들고, 이는 ‘부모님이 예전에 운전하시던 자동차의 모델’이라는 작가의 덧붙임, 그리고 반대편에 걸려있는 ‘가려진 눈’과 조응하며 ‘기억’이라는 정서적인 이야기를 기대하게 만든다.",
          "‘가려진 눈’이 표현된 양상은 앞서 말한 그림 중에 가장 다르다. 그의 작업을 하나의 맥락으로 묶는 과정에서 해당 그림이 겉돌 수 있는 위험성이 있지만, 그 반대로 좀 더 깊은 이야기로 진입할 수 있게 도와주는 표지의 가능성을 갖고 있다고도 생각된다. ‘가려진 눈’을 제외한 나머지의 그림들은 대상과 어느 정도 거리감을 갖고 있다. 물론 거리감은 각기 다르지만, 여전히 외부에서 그것을 바라보는 태도를 유지하고 있다면, ‘가려진 눈’에서는 거리감이 느껴지지 않는다. 마치 안개나 바람처럼 대상 내부에 이미 들어가 있는 인상을 준다. 이때부터는 그의 그림들이 단순히 사진과 회화라는 매체에 대해서 혹은 바니타스적인 이야기를 하고 있는 것이 아니라는 확신을 준다. 무언가를 뚫어지게 쳐다보는 열의와 욕망을 감지한다. 그 눈빛이 닿는 곳이 궁금해진다. 그러나 만약 이것이 좀 더 매체에 대한 탐구나 미술사의 맥락을 가져오고자 하는 시도가 중요한 작업이라면, 비단이라는 물성, 아크릴과 먹이라는 재료에 대한 탐구와 더불어 화면 그 자체에 집중하는 방향으로 작업이 전개될 수도 있겠다고도 예상해본다. 그럼에도 불구하고 나는 그가 ‘자신의 이야기’를 계속해서 해보고자 노력하는 시도를 해오고 있다고 느꼈는데, 두개의 관심사를 하나의 맥락으로 엮어 보여줄 수도 있을 것이다. 사진이라는 매체를 떠올리게 하는 그의 그림들이 개인의 이야기(기억이나 일상과 같은 키워드)의 성질과 어느 정도 공유하는 특성이 있다고 느껴지기 때문이다. 아무래도 졸업 전시를 앞두고 있다는 소식을 들으니 앞으로의 작업 전개가 궁금해진다. 무엇이든 좋을 것 같다."

        const articles = textsData.map(t => {
          const pTags = t.content.map(p => `            <p>${p}</p>`).join('\n');
          const fnTags = t.footnotes && t.footnotes.length > 0 ? `
            <div class="reader-footnotes" style="margin-top: 36px; padding-top: 16px; border-top: 1px solid #eeeeee; font-size: 13.5px; line-height: 1.6;">
${t.footnotes.map(f => `              <p style="margin-bottom: 4px; text-indent: 0;">${f}</p>`).join('\n')}
            </div>` : '';

          return `
        <article id="${t.id}" class="reader-article" style="display: none;">
          <header class="reader-header" style="padding: 0; background: none;">
            <h1 class="reader-title">${t.title}</h1>
            <p class="reader-meta">${t.author}, ${t.year}</p>
          </header>
          <div class="reader-body">
${pTags}${fnTags}
          </div>
        </article>`;
        }).join('\n');

        return `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="nav-text"><a class="nav-link">Ku Taeseung</a> / <a class="nav-link">Exhibitions</a> / <a class="nav-link">Selected Works</a> / <a class="nav-link active">Texts</a> / <a class="nav-link">Info</a> / <a class="nav-link">etc...</a></nav>
  </header>
  <main>
    <div class="reader-container">
      <nav class="reader-nav">
        <div class="reader-group">${navLinks}
        </div>
      </nav>
      <section class="reader-content">${articles}
      </section>
    </div>
  </main>
  <script>
    function showText(id, element) {
      document.querySelectorAll('.reader-article').forEach(el => el.style.display = 'none');
      const target = document.getElementById(id);
      if (target) target.style.display = 'block';
      document.querySelectorAll('.reader-link').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
    }
  <\/script>
</body>
</html>`;
      }
    }

    function downloadCurrentFile() {
      let content = '';
      let filename = '';

      if (currentMode === 'works') {
        content = generateWorksHtml();
        filename = 'works.html';
      } else if (currentMode === 'texts') {
        content = generateTextsJson();
        filename = 'texts-data.json';
      } else {
        content = generateExhibitionsHtml();
        filename = 'exhibitions.html';
      }

      const blob = new Blob([content], { type: currentMode === 'texts' ? 'application/json;charset=utf-8' : 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    window.onload = () => {
      setMode('works');
    };
  </script>

</body>
</html>
