<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ku Taeseung - Studio Manager</title>
<style>
:root{--bg-panel:#fcfcfc;--border-color:#e0e0e0;--primary-blue:#0066cc;--edit-orange:#d97706;--connected-green:#0a8a3f;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif;font-size:13px;background-color:#f0f0f2;color:#111;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:#fff;border-bottom:1px solid var(--border-color);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;}
.header-title{font-size:15px;font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.folder-status{font-size:12px;color:#999;}
.folder-status.connected{color:var(--connected-green);font-weight:600;}
.btn-folder{background:#fff;color:#111;border:1px solid #ccc;padding:8px 14px;font-size:13px;font-weight:500;border-radius:4px;cursor:pointer;}
.btn-folder:hover{background:#f5f5f5;}
.btn-folder.connected{border-color:var(--connected-green);color:var(--connected-green);}
.main-layout{display:flex;flex:1;height:calc(100vh - 55px);}
.edit-panel{width:520px;background:var(--bg-panel);border-right:1px solid var(--border-color);padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;}
.nav-tabs{display:flex;gap:6px;border-bottom:1px solid #ddd;padding-bottom:10px;}
.tab-btn{background:none;border:none;font-size:13px;font-weight:500;padding:6px 12px;cursor:pointer;border-radius:4px;}
.tab-btn.active{background-color:#000;color:#fff;}
.section-box{background:#fff;border:1px solid var(--border-color);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.section-title{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:12px;color:#666;}
input,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #ccc;border-radius:4px;outline:none;}
input:focus,textarea:focus{border-color:#000;}
textarea{resize:vertical;min-height:70px;line-height:1.5;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-action{background:#000;color:#fff;border:none;padding:10px;font-size:13px;font-weight:500;border-radius:4px;cursor:pointer;}
.btn-action:hover{background:#333;}
.btn-cancel{background:#888;color:#fff;border:none;padding:10px;font-size:13px;font-weight:500;border-radius:4px;cursor:pointer;}
.btn-cancel:hover{background:#666;}
.btn-download{background:var(--primary-blue);color:#fff;border:none;padding:9px 16px;font-size:13px;font-weight:600;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-download:hover{background:#0052a3;}
.item-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.item-card{background:#fafafa;border:1px solid #e5e5e5;padding:10px 12px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:10px;}
.item-card.editing{border-color:var(--edit-orange);background:#fffbeb;}
.item-info{flex:1;word-break:break-all;}
.item-controls{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.btn-reorder{background:#eee;border:1px solid #ccc;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;}
.btn-reorder:hover{background:#ddd;}
.btn-edit{background:#fff;border:1px solid #ccc;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;color:#0066cc;font-weight:500;}
.btn-edit:hover{background:#f0f7ff;}
.btn-detail{background:#fff;border:1px solid #ccc;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px;color:#d97706;font-weight:500;}
.btn-detail:hover{background:#fff7ed;}
.btn-delete{color:#c00;background:none;border:none;cursor:pointer;font-size:12px;margin-left:4px;}
.hint{font-size:11px;color:#999;}
.preview-panel{flex:1;background:#fff;display:flex;flex-direction:column;}
.preview-bar{background:#f8f8fa;border-bottom:1px solid var(--border-color);padding:8px 16px;font-size:12px;color:#777;}
iframe{width:100%;flex:1;border:none;background:#fff;}
</style>
</head>
<body>
<header>
<div class="header-title">Ku Taeseung - Studio Manager</div>
<div class="header-right">
<span class="folder-status" id="folder-status">폴더 연결 안 됨</span>
<button class="btn-folder" id="btn-folder" onclick="connectFolder()">폴더 연결</button>
<button class="btn-download" onclick="downloadCurrentFile()">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
<span id="btn-download-text">works.html 저장</span>
</button>
</div>
</header>

<div class="main-layout">
<div class="edit-panel">
<div class="nav-tabs">
<button class="tab-btn active" onclick="setMode('works')">Selected Works</button>
<button class="tab-btn" onclick="setMode('texts')">Texts (JSON)</button>
<button class="tab-btn" onclick="setMode('exhibitions')">Exhibitions</button>
</div>

<!-- 1. Selected Works -->
<div id="panel-works" class="section-box">
<div class="section-title"><span id="works-form-title">새 작품 추가하기</span><span id="works-edit-badge" style="display:none;font-size:11px;color:#d97706;font-weight:normal;">(수정 모드)</span></div>
<div class="row">
<div class="form-group"><label>파일명 (images/selected-works/ 안)</label><input type="text" id="w-file" placeholder="frank.jpg"></div>
<div class="form-group"><label>세로 높이 (cm)</label><input type="number" id="w-h" placeholder="65"></div>
</div>
<div class="row">
<div class="form-group"><label>제목</label><input type="text" id="w-title" placeholder="Frank"></div>
<div class="form-group"><label>제작 연도</label><input type="text" id="w-year" placeholder="2024"></div>
</div>
<div class="row">
<div class="form-group"><label>재료 (선택)</label><input type="text" id="w-material"></div>
<div class="form-group"><label>크기 cm (선택)</label><input type="text" id="w-size" placeholder="65x52cm"></div>
</div>
<div style="display:flex;gap:8px;">
<button id="btn-save-work" class="btn-action" style="flex:1;" onclick="saveWork()">+ 목록에 작품 추가</button>
<button id="btn-cancel-work" class="btn-cancel" style="display:none;" onclick="cancelEditWork()">취소</button>
</div>
<div style="margin-top:16px;"><label><strong>등록된 작품 목록</strong> (수정/▲▼/삭제)</label><div class="item-list" id="works-list"></div></div>
</div>

<!-- 2. Texts -->
<div id="panel-texts" class="section-box" style="display:none;">
<div class="section-title"><span id="texts-form-title">새 글 / 평론 추가하기</span><span id="texts-edit-badge" style="display:none;font-size:11px;color:#d97706;font-weight:normal;">(수정 모드)</span></div>
<div class="row">
<div class="form-group"><label>저자 / 필자</label><input type="text" id="t-author"></div>
<div class="form-group"><label>작성 연도</label><input type="text" id="t-year" placeholder="2025"></div>
</div>
<div class="form-group"><label>글 제목</label><input type="text" id="t-title" placeholder="Before This River Becomes an Ocean"></div>
<div class="form-group"><label>본문 내용 (엔터 2번으로 문단 구분)</label><textarea id="t-content" style="min-height:120px;"></textarea></div>
<div class="form-group"><label>각주 (선택, 엔터 1번으로 구분)</label><textarea id="t-footnotes" style="min-height:50px;"></textarea></div>
<div style="display:flex;gap:8px;">
<button id="btn-save-text" class="btn-action" style="flex:1;" onclick="saveText()">+ 목록에 글 추가</button>
<button id="btn-cancel-text" class="btn-cancel" style="display:none;" onclick="cancelEditText()">취소</button>
</div>
<div style="margin-top:16px;"><label><strong>등록된 글 목록</strong></label><div class="item-list" id="texts-list"></div></div>
</div>

<!-- 3. Exhibitions -->
<div id="panel-exhibitions" class="section-box" style="display:none;">
<div class="section-title"><span id="exhibitions-form-title">새 전시 추가하기</span><span id="exhibitions-edit-badge" style="display:none;font-size:11px;color:#d97706;font-weight:normal;">(수정 모드)</span></div>
<div class="form-group"><label>상세 HTML 파일명</label><input type="text" id="e-link" placeholder="Amator.html"></div>
<div class="row">
<div class="form-group"><label>목록용 대표 이미지 (images/exhibitions/)</label><input type="text" id="e-img" placeholder="Amator0.jpg"></div>
<div class="form-group"><label>목록용 캡션</label><input type="text" id="e-caption" placeholder="Amator, Long Vacance, 2026"></div>
</div>
<hr style="border:none;border-top:1px solid #eee;margin:4px 0;">
<div class="hint">아래는 상세페이지(전시 서문 + 설치 전경) 내용입니다. Amator.html과 같은 구조로 생성됩니다.</div>
<div class="form-group"><label>전시 제목</label><input type="text" id="e-title" placeholder="Amator"></div>
<div class="row">
<div class="form-group"><label>장소 / 부제</label><input type="text" id="e-venue" placeholder="Long Vacance"></div>
<div class="form-group"><label>기간</label><input type="text" id="e-daterange" placeholder="2026. 00. 00 – 00. 00"></div>
</div>
<div class="form-group"><label>서문 / 작가노트</label><textarea id="e-statement" style="min-height:90px;"></textarea></div>
<div class="form-group"><label>설치 전경 사진 (한 줄에 "파일명 | 캡션", images/exhibitions/ 안)</label><textarea id="e-photos" placeholder="Amator01.jpg | Installation view 01&#10;Amator02.jpg | Installation view 02" style="min-height:110px;"></textarea></div>
<div style="display:flex;gap:8px;">
<button id="btn-save-exhibition" class="btn-action" style="flex:1;" onclick="saveExhibition()">+ 목록에 전시 추가</button>
<button id="btn-cancel-exhibition" class="btn-cancel" style="display:none;" onclick="cancelEditExhibition()">취소</button>
</div>
<div style="margin-top:16px;"><label><strong>등록된 전시 목록</strong> (수정 / 상세페이지 저장 / ▲▼ / 삭제)</label><div class="item-list" id="exhibitions-list"></div></div>
</div>

</div>

<div class="preview-panel">
<div class="preview-bar" id="preview-bar-title">works.html</div>
<iframe id="preview-frame"></iframe>
</div>
</div>

<script>
let currentMode = 'works';
let editingWorkIndex = -1;
let editingTextIndex = -1;
let editingExhibitionIndex = -1;
let dirHandle = null;

let worksData = [
{file:'colorchecker.jpg',h:60,title:'Colorchecker',year:'2024',material:'',size:''},
{file:'duet1.jpg',h:55,title:'Duet 1',year:'2024',material:'',size:''},
{file:'duet2.jpg',h:55,title:'Duet 2',year:'2024',material:'',size:''},
{file:'frank.jpg',h:65,title:'Frank',year:'2024',material:'',size:''},
{file:'greenwood.jpg',h:70,title:'Greenwood',year:'2024',material:'',size:''},
{file:'middle eyeI.png',h:50,title:'Middle Eye I',year:'2023',material:'',size:''},
{file:'optogram.png',h:45,title:'Optogram',year:'2023',material:'',size:''},
{file:'optography.jpg',h:45,title:'Optography',year:'2023',material:'',size:''},
{file:'strokes.png',h:60,title:'Strokes',year:'2024',material:'',size:''},
{file:'sunpainting.png',h:65,title:'Sun Painting',year:'2024',material:'',size:''},
{file:'woodnew.png',h:58,title:'Wood New',year:'2024',material:'',size:''},
{file:'woodnew2.png',h:58,title:'Wood New 2',year:'2024',material:'',size:''}
];

let textsData = [];

let exhibitionsData = [
{link:'Amator.html', img:'Amator0.jpg', caption:'Amator, Long Vacance, 2026',
 title:'Amator', venue:'Long Vacance', dateRange:'2026. 00. 00 – 00. 00',
 statement:'전시 서문 또는 작가노트 텍스트가 들어가는 공간입니다. 왼쪽 4칸의 폭에 맞춰 차분하게 정렬됩니다.',
 photos:[{file:'Amator0.jpg', caption:'Installation view 01'},{file:'Amator0.jpg', caption:'Installation view 02'}]}
];

/* --- 폴더 연결 (File System Access API, Chrome/Edge) --- */
async function connectFolder(){
if(!window.showDirectoryPicker){
alert('이 브라우저는 폴더 연결을 지원하지 않습니다. Chrome 또는 Edge에서 열어주세요.');
return;
}
try{
dirHandle = await window.showDirectoryPicker({mode:'readwrite'});
document.getElementById('folder-status').innerText = '연결됨: ' + dirHandle.name;
document.getElementById('folder-status').classList.add('connected');
document.getElementById('btn-folder').innerText = '폴더 재연결';
document.getElementById('btn-folder').classList.add('connected');
updateDownloadButtonLabel();
}catch(err){
if(err.name !== 'AbortError') alert('폴더 연결에 실패했습니다: ' + err.message);
}
}

async function writeFileToFolder(filename, content){
const fileHandle = await dirHandle.getFileHandle(filename, {create:true});
const writable = await fileHandle.createWritable();
await writable.write(content);
await writable.close();
}

function updateDownloadButtonLabel(){
const downloadLabels = {works:'works.html', texts:'texts-data.json', exhibitions:'exhibitions.html'};
const suffix = dirHandle ? ' 저장' : ' 다운로드';
document.getElementById('btn-download-text').innerText = downloadLabels[currentMode] + suffix;
}

function downloadBlob(content, filename, mimeType){
const blob = new Blob([content], {type: mimeType});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = filename;
a.click();
URL.revokeObjectURL(a.href);
}

function setMode(mode){
currentMode = mode;
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
document.getElementById('panel-works').style.display = mode==='works'?'block':'none';
document.getElementById('panel-texts').style.display = mode==='texts'?'block':'none';
document.getElementById('panel-exhibitions').style.display = mode==='exhibitions'?'block':'none';
updateDownloadButtonLabel();
document.getElementById('preview-bar-title').innerText = mode==='texts'?'texts.html (JSON)':(mode+'.html');
cancelEditWork(); cancelEditText(); cancelEditExhibition();
updateUI();
}

function moveItem(array, index, direction){
const targetIndex = index+direction;
if(targetIndex<0||targetIndex>=array.length) return;
const temp = array[index]; array[index]=array[targetIndex]; array[targetIndex]=temp;
updateUI();
}

/* --- Works --- */
function editWork(idx){
editingWorkIndex = idx;
const w = worksData[idx];
document.getElementById('w-file').value = w.file;
document.getElementById('w-h').value = w.h;
document.getElementById('w-title').value = w.title;
document.getElementById('w-year').value = w.year;
document.getElementById('w-material').value = w.material;
document.getElementById('w-size').value = w.size;
document.getElementById('works-form-title').innerText = w.title;
document.getElementById('works-edit-badge').style.display = 'inline';
document.getElementById('btn-save-work').innerText = '수정 내용 저장';
document.getElementById('btn-cancel-work').style.display = 'inline-block';
updateUI();
}
function cancelEditWork(){
editingWorkIndex = -1;
['w-file','w-h','w-title','w-year','w-material','w-size'].forEach(id=>document.getElementById(id).value='');
document.getElementById('works-form-title').innerText = '새 작품 추가하기';
document.getElementById('works-edit-badge').style.display = 'none';
document.getElementById('btn-save-work').innerText = '+ 목록에 작품 추가';
document.getElementById('btn-cancel-work').style.display = 'none';
updateUI();
}
function saveWork(){
const file = document.getElementById('w-file').value.trim();
const h = document.getElementById('w-h').value.trim() || 60;
const title = document.getElementById('w-title').value.trim() || 'Untitled';
const year = document.getElementById('w-year').value.trim() || '2024';
const material = document.getElementById('w-material').value.trim();
const size = document.getElementById('w-size').value.trim();
if(!file){ alert('파일명을 입력하세요.'); return; }
if(editingWorkIndex>-1){ worksData[editingWorkIndex] = {file,h,title,year,material,size}; }
else{ worksData.push({file,h,title,year,material,size}); }
cancelEditWork();
}
function removeWork(idx){
if(editingWorkIndex===idx) cancelEditWork();
worksData.splice(idx,1); updateUI();
}

/* --- Texts --- */
function editText(idx){
editingTextIndex = idx;
const t = textsData[idx];
document.getElementById('t-author').value = t.author;
document.getElementById('t-year').value = t.year;
document.getElementById('t-title').value = t.title;
document.getElementById('t-content').value = t.content.join('\n\n');
document.getElementById('t-footnotes').value = (t.footnotes||[]).join('\n');
document.getElementById('texts-form-title').innerText = t.title;
document.getElementById('texts-edit-badge').style.display = 'inline';
document.getElementById('btn-save-text').innerText = '수정 내용 저장';
document.getElementById('btn-cancel-text').style.display = 'inline-block';
updateUI();
}
function cancelEditText(){
editingTextIndex = -1;
['t-author','t-year','t-title','t-content','t-footnotes'].forEach(id=>document.getElementById(id).value='');
document.getElementById('texts-form-title').innerText = '새 글 / 평론 추가하기';
document.getElementById('texts-edit-badge').style.display = 'none';
document.getElementById('btn-save-text').innerText = '+ 목록에 글 추가';
document.getElementById('btn-cancel-text').style.display = 'none';
updateUI();
}
function saveText(){
const author = document.getElementById('t-author').value.trim();
const year = document.getElementById('t-year').value.trim() || '2025';
const title = document.getElementById('t-title').value.trim();
const rawContent = document.getElementById('t-content').value.trim();
const rawFootnotes = document.getElementById('t-footnotes').value.trim();
if(!rawContent){ alert('본문을 입력하세요.'); return; }
const content = rawContent.split('\n\n').filter(p=>p.trim()!=='');
const footnotes = rawFootnotes ? rawFootnotes.split('\n').filter(f=>f.trim()!=='') : [];
if(editingTextIndex>-1){ textsData[editingTextIndex] = {id:textsData[editingTextIndex].id, author, title, year, content, footnotes}; }
else{ textsData.push({id:'text-'+Date.now(), author, title, year, content, footnotes}); }
cancelEditText();
}
function removeText(idx){
if(editingTextIndex===idx) cancelEditText();
textsData.splice(idx,1); updateUI();
}

/* --- Exhibitions --- */
function editExhibition(idx){
editingExhibitionIndex = idx;
const e = exhibitionsData[idx];
document.getElementById('e-link').value = e.link;
document.getElementById('e-img').value = e.img;
document.getElementById('e-caption').value = e.caption;
document.getElementById('e-title').value = e.title||'';
document.getElementById('e-venue').value = e.venue||'';
document.getElementById('e-daterange').value = e.dateRange||'';
document.getElementById('e-statement').value = e.statement||'';
document.getElementById('e-photos').value = (e.photos||[]).map(p=>p.file+' | '+p.caption).join('\n');
document.getElementById('exhibitions-form-title').innerText = e.caption;
document.getElementById('exhibitions-edit-badge').style.display = 'inline';
document.getElementById('btn-save-exhibition').innerText = '수정 내용 저장';
document.getElementById('btn-cancel-exhibition').style.display = 'inline-block';
updateUI();
}
function cancelEditExhibition(){
editingExhibitionIndex = -1;
['e-link','e-img','e-caption','e-title','e-venue','e-daterange','e-statement','e-photos'].forEach(id=>document.getElementById(id).value='');
document.getElementById('exhibitions-form-title').innerText = '새 전시 추가하기';
document.getElementById('exhibitions-edit-badge').style.display = 'none';
document.getElementById('btn-save-exhibition').innerText = '+ 목록에 전시 추가';
document.getElementById('btn-cancel-exhibition').style.display = 'none';
updateUI();
}
function parsePhotos(raw){
return raw.split('\n').map(l=>l.trim()).filter(l=>l).map(l=>{
const parts = l.split('|');
return {file:(parts[0]||'').trim(), caption:(parts[1]||'').trim()};
});
}
function saveExhibition(){
const link = document.getElementById('e-link').value.trim() || 'Amator.html';
const img = document.getElementById('e-img').value.trim() || 'Amator0.jpg';
const caption = document.getElementById('e-caption').value.trim();
const title = document.getElementById('e-title').value.trim();
const venue = document.getElementById('e-venue').value.trim();
const dateRange = document.getElementById('e-daterange').value.trim();
const statement = document.getElementById('e-statement').value.trim();
const photos = parsePhotos(document.getElementById('e-photos').value);
const item = {link,img,caption,title,venue,dateRange,statement,photos};
if(editingExhibitionIndex>-1){ exhibitionsData[editingExhibitionIndex] = item; }
else{ exhibitionsData.push(item); }
cancelEditExhibition();
}
function removeExhibition(idx){
if(editingExhibitionIndex===idx) cancelEditExhibition();
exhibitionsData.splice(idx,1); updateUI();
}

/* --- UI --- */
function updateUI(){
document.getElementById('works-list').innerHTML = worksData.map((w,idx)=>`
<div class="item-card ${editingWorkIndex===idx?'editing':''}">
<div class="item-info"><strong>${idx+1}.</strong> ${w.title} (${w.h}cm) ${w.size?'· '+w.size:''} ${w.material?'· '+w.material:''}</div>
<div class="item-controls">
<button class="btn-edit" onclick="editWork(${idx})">수정</button>
<button class="btn-reorder" onclick="moveItem(worksData,${idx},-1)">▲</button>
<button class="btn-reorder" onclick="moveItem(worksData,${idx},1)">▼</button>
<button class="btn-delete" onclick="removeWork(${idx})">삭제</button>
</div></div>`).join('');

document.getElementById('texts-list').innerHTML = textsData.map((t,idx)=>`
<div class="item-card ${editingTextIndex===idx?'editing':''}">
<div class="item-info"><strong>${idx+1}.</strong> ${t.author}, ${t.title} (${t.year})</div>
<div class="item-controls">
<button class="btn-edit" onclick="editText(${idx})">수정</button>
<button class="btn-reorder" onclick="moveItem(textsData,${idx},-1)">▲</button>
<button class="btn-reorder" onclick="moveItem(textsData,${idx},1)">▼</button>
<button class="btn-delete" onclick="removeText(${idx})">삭제</button>
</div></div>`).join('');

document.getElementById('exhibitions-list').innerHTML = exhibitionsData.map((e,idx)=>`
<div class="item-card ${editingExhibitionIndex===idx?'editing':''}">
<div class="item-info"><strong>${idx+1}.</strong> ${e.caption}</div>
<div class="item-controls">
<button class="btn-edit" onclick="editExhibition(${idx})">수정</button>
<button class="btn-detail" onclick="saveExhibitionDetail(${idx})">상세페이지</button>
<button class="btn-reorder" onclick="moveItem(exhibitionsData,${idx},-1)">▲</button>
<button class="btn-reorder" onclick="moveItem(exhibitionsData,${idx},1)">▼</button>
<button class="btn-delete" onclick="removeExhibition(${idx})">삭제</button>
</div></div>`).join('');

const iframe = document.getElementById('preview-frame');
const doc = iframe.contentWindow.document;
doc.open(); doc.write(generatePreviewDocument(currentMode)); doc.close();
}

async function saveExhibitionDetail(idx){

/* --- texts.html preview (reader) --- */
function generateTextsJson(){
return JSON.stringify(textsData, null, 2);
}
function generatePreviewDocument(mode){
if(mode==='works') return generateWorksHtml();
if(mode==='exhibitions') return generateExhibitionsHtml();
const navLinks = textsData.map(t=>`<a class="reader-link" onclick="showText('${t.id}',this)">${t.author}, ${t.title} (${t.year})</a>`).join('\n');
const articles = textsData.map(t=>{
const pTags = t.content.map(p=>`<p>${p}</p>`).join('\n');
const fnTags = (t.footnotes&&t.footnotes.length>0) ? `<div class="reader-footnotes" style="margin-top:36px;padding-top:16px;border-top:1px solid #eee;font-size:13.5px;line-height:1.6;">${t.footnotes.map(f=>`<p style="margin-bottom:4px;text-indent:0;">${f}</p>`).join('\n')}</div>` : '';
return `<article id="${t.id}" class="reader-article" style="display:none;">
<header class="reader-header" style="padding:0;background:none;">
<h1 class="reader-title">${t.title}</h1>
<p class="reader-meta">${t.author}, ${t.year}</p>
</header>
<div class="reader-body">${pTags}${fnTags}</div>
</article>`;
}).join('\n');
return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<nav class="nav-text">
<a class="nav-link">Ku Taeseung</a>
<a class="nav-link">Exhibitions</a>
<a class="nav-link">Selected Works</a>
<a class="nav-link active">Texts</a>
<a class="nav-link">Info</a>
<a class="nav-link">etc...</a>
</nav>
</header>
<main>
<div class="reader-container">
<nav class="reader-nav"><div class="reader-group">${navLinks}</div></nav>
<section class="reader-content">${articles}</section>
</div>
</main>
<script>
function showText(id,element){
document.querySelectorAll('.reader-article').forEach(el=>el.style.display='none');
const target = document.getElementById(id);
if(target) target.style.display='block';
document.querySelectorAll('.reader-link').forEach(el=>el.classList.remove('active'));
if(element) element.classList.add('active');
}
<\/script>
</body>
</html>`;
}

async function downloadCurrentFile(){
let content, filename, mimeType;
if(currentMode==='works'){ content=generateWorksHtml(); filename='works.html'; mimeType='text/html;charset=utf-8'; }
else if(currentMode==='texts'){ content=generateTextsJson(); filename='texts-data.json'; mimeType='application/json;charset=utf-8'; }
else{ content=generateExhibitionsHtml(); filename='exhibitions.html'; mimeType='text/html;charset=utf-8'; }

if(dirHandle){
try{
await writeFileToFolder(filename, content);
alert(filename + ' 저장 완료');
}catch(err){ alert('저장 실패: ' + err.message + '\n다운로드로 대신 저장합니다.'); downloadBlob(content, filename, mimeType); }
}else{
downloadBlob(content, filename, mimeType);
}
}

window.onload = function(){ updateUI(); };
</script>
</body>
</html>
