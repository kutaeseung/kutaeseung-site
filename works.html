<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ku Taeseung - Selected Works</title>
  <script>
    (function(d) {
      var config = {
        kitId: 'uuz4kkr',
        scriptTimeout: 3000,
        async: true
      },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
    })(document);
  </script>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Selected Works 전용 인라인 CSS */
    .works-wall {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 24px;
      row-gap: 80px;
      width: 100%;
    }



    .work-frame {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
      /* 1cm = 2.8px 비례 스케일 */
      height: calc(var(--h, 60) * 2.8px);
      cursor: pointer;
    }



    .work-frame img {
      height: 100% !important;
      width: auto !important;
      max-width: none !important;
      display: block;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }



    .work-frame:hover img {
      opacity: 0.85;
    }



    /* 라이트박스 모달 */
    .work-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 99999;
      cursor: pointer;
      padding: 40px;
      box-sizing: border-box;
    }



    .work-modal.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }



    .modal-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 90vw;
      max-height: 90vh;
      cursor: default;
    }



    .modal-box img {
      max-width: 82vw;
      max-height: 75vh;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }



    .modal-caption {
      margin-top: 20px;
      text-align: center;
      font-size: 15px;
      font-family: inherit;
      color: #000000;
      line-height: 1.5;
    }


    /* 모바일 반응형: 한 작품씩 세로로, 가운데 정렬 (가로 스크롤 방지) */
    @media (max-width: 768px) {
      .works-wall {
        flex-direction: column;
        align-items: center;
        gap: 16px;
        row-gap: 40px;
      }


      .work-frame {
        width: 100%;
        align-items: center;
        height: calc(var(--h, 60) * 1.6px);
      }
    }
  </style>
</head>
<body>


  <header>
    <nav class="nav-text"><span class="nav-name"><a href="index.html" class="nav-link">Ku Taeseung</a></span><span class="nav-sep"> / </span><span class="nav-links"><a href="exhibitions-projects.html" class="nav-link">Exhibitions &amp; Projects</a> / <a href="works.html" class="nav-link active">Selected Works</a> / <a href="texts.html" class="nav-link">Texts</a> / <a href="info.html" class="nav-link">Info</a> / <a href="etc.html" class="nav-link">etc...</a></span></nav>
  </header>


  <main>
    <div class="works-wall" id="works-wall">





    </div>
  </main>


  <div id="work-modal" class="work-modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="modal-img" src="" alt="" onclick="closeModal()">
      <p id="modal-caption" class="modal-caption"></p>
    </div>
  </div>


  <script>
    document.getElementById('works-wall').addEventListener('click', function(e) {
      const frame = e.target.closest('.work-frame');
      if (!frame) return;
      openModal(frame, frame.dataset.title, frame.dataset.year, frame.dataset.material, frame.dataset.size);
    });

    function openModal(element, title, year, material, size) {
      const img = element.querySelector('img');
      const modal = document.getElementById('work-modal');
      const modalImg = document.getElementById('modal-img');
      const modalCaption = document.getElementById('modal-caption');

      modalImg.src = img.src;

      const parts = [];
      if (title) parts.push(title);
      if (year) parts.push(year);
      if (material) parts.push(material);
      if (size) parts.push(size);

      modalCaption.textContent = parts.join(', ');

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('work-modal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>


</body>
</html>
