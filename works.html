  <style>
    /* Selected Works 전용 인라인 CSS */
    .works-wall {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 24px;
      row-gap: 80px;
      width: 100%;
    }



    .work-frame {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
      /* 1cm = 2.8px 비례 스케일 */
      height: calc(var(--h, 60) * 2.8px);
      cursor: pointer;
    }



    .work-frame img {
      height: 100% !important;
      width: auto !important;
      max-width: none !important;
      display: block;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }



    .work-frame:hover img {
      opacity: 0.85;
    }



    /* 라이트박스 모달 */
    .work-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 99999;
      cursor: pointer;
      padding: 40px;
      box-sizing: border-box;
    }



    .work-modal.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }



    .modal-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 90vw;
      max-height: 90vh;
      cursor: default;
    }



    .modal-box img {
      max-width: 82vw;
      max-height: 75vh;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }



    .modal-caption {
      margin-top: 20px;
      text-align: center;
      font-size: 15px;
      font-family: inherit;
      color: #000000;
      line-height: 1.5;
    }


    /* 모바일 반응형: 좁은 화면에서 벽면 스케일 축소 (가로 스크롤 방지) */
    @media (max-width: 768px) {
      .works-wall {
        gap: 16px;
        row-gap: 40px;
      }


      .work-frame {
        height: calc(var(--h, 60) * 1.6px);
      }
    }
  </style>
</head>

  <!-- 라이트박스 모달 -->
  <div id="work-modal" class="work-modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="modal-img" src="" alt="" onclick="closeModal()">
      <p id="modal-caption" class="modal-caption"></p>
    </div>
  </div>



  <script>
    // 작품 프레임 클릭 처리: onclick 문자열 조립 대신 이벤트 리스너 1개로 위임
    document.getElementById('works-wall').addEventListener('click', function(e) {
      const frame = e.target.closest('.work-frame');
      if (!frame) return;
      openModal(frame, frame.dataset.title, frame.dataset.year, frame.dataset.material, frame.dataset.size);
    });



    function openModal(element, title, year, material, size) {
      const img = element.querySelector('img');
      const modal = document.getElementById('work-modal');
      const modalImg = document.getElementById('modal-img');
      const modalCaption = document.getElementById('modal-caption');



      modalImg.src = img.src;



      // 캡션: 제목, 제작연도, 재료, 크기(세로×가로cm) - 낫표(〈〉) 없이 순수 텍스트 나열
      const parts = [];
      if (title) parts.push(title);
      if (year) parts.push(year);
      if (material) parts.push(material);
      if (size) parts.push(size);



      modalCaption.textContent = parts.join(', ');



      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }



    function closeModal() {
      const modal = document.getElementById('work-modal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }



    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
